baseURL = "https://sayymeer.github.io/"
locale = "en-us"
title = "sayymeer"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  
[params]
  author = "sayymeer"
  description = "I am a software developer, intersted in systems and cybersecurity."
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  # ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  math = true
  env = "production"
  mainSections = ["posts", "editorials"]

[params.homeInfoParams]
  Title = "Hi, I'm Sameer"
  Content = "Undergraduate @ IIT Kanpur"

